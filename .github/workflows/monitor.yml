name: price-monitor
on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
jobs:
  monitor:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: monitor
        run: python main.py
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_OPEN_ID: ${{ secrets.FEISHU_OPEN_ID }}
      - name: keepalive + state
        run: |
          T=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ $(cat keepalive.txt 2>/dev/null) != "$T" ]; then
            echo "$T" > keepalive.txt
          fi
          if git status --porcelain | grep -q .; then
            git config user.name "price-monitor"
            git config user.email "monitor@users.noreply.github.com"
            git add -A
            git commit -m "auto $(date -u +%m-%d_%H:%M)"
            git push
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
